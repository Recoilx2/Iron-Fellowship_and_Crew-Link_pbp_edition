# Optional admin dashboard add-on. Studio and postgres-meta are NOT part of
# the base stack; start them temporarily when you need a UI for SQL, users or
# buckets, then stop them again:
#
#   ENV_FILE=.env.ironsworn docker compose -p ironsworn --env-file .env.ironsworn \
#     -f docker-compose.yml -f studio.docker-compose.yml up -d studio
#   # browse http://localhost:3000 (or your STUDIO_HTTP_PORT), then:
#   ENV_FILE=.env.ironsworn docker compose -p ironsworn --env-file .env.ironsworn \
#     -f docker-compose.yml -f studio.docker-compose.yml stop studio meta
#
# Day-to-day admin (psql, backups) does not need this file; see README.
# Pins match the base template's upstream commit (supabase/supabase @ 189adda9).

services:
  meta:
    image: supabase/postgres-meta:v0.100.0
    restart: unless-stopped
    profiles:
      - studio
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: ${POSTGRES_HOST}
      PG_META_DB_PORT: ${POSTGRES_PORT}
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

  studio:
    image: supabase/studio:2026.11.02-sha-a05e7ec
    restart: unless-stopped
    profiles:
      - studio
    depends_on:
      meta:
        condition: service_started
    ports:
      - ${STUDIO_HTTP_PORT:-3000}:3000/tcp
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      HOSTNAME: "0.0.0.0"

      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres

      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

      DEFAULT_ORGANIZATION_NAME: Iron Fellowship
      DEFAULT_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-supabase}

      SUPABASE_URL: http://api-gw:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
