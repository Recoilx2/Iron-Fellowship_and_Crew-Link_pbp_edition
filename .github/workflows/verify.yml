name: verify

# Template: the setup session writes .github/workflows/verify.yml from this file
# with `python3 tools/agents/setup.py ci --write`. It runs the project's verify
# command on every PR, so the remote result is independent proof of the head.
on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: |
          npm run lint && npx tsc --noEmit && npm test && npm run test:supabase
