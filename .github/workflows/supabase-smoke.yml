# Starts both Supabase copies from the template and runs the smoke test, and
# runs every stack behavior test (*.live.test.ts) against one copy.
# The sandbox has no Docker, so this runs in GitHub Actions on every pull request.
name: supabase-smoke

on:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test "supabase/tests/*.test.mjs"

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@v4

      - name: Generate per-copy env files
        run: |
          python3 bin/gen-env.py --copy ironsworn --port 8000 --out .env.ironsworn
          python3 bin/gen-env.py --copy starforged --port 8001 --out .env.starforged

      - name: Validate the template renders
        run: |
          ENV_FILE=.env.ironsworn docker compose -p ironsworn --env-file .env.ironsworn -f docker-compose.yml config --quiet
          ENV_FILE=.env.starforged docker compose -p starforged --env-file .env.starforged -f docker-compose.yml config --quiet

      - name: Run the smoke test (both copies side by side)
        run: CLEANUP=0 tests/smoke.sh

      - name: Dump service logs on failure
        if: failure()
        run: |
          for copy in ironsworn starforged; do
            echo "===== $copy ====="
            ENV_FILE=.env.$copy docker compose -p $copy --env-file .env.$copy -f docker-compose.yml logs --tail 200
          done

      - name: Bring both copies down
        if: always()
        run: |
          ENV_FILE=.env.ironsworn docker compose -p ironsworn --env-file .env.ironsworn -f docker-compose.yml down -v
          ENV_FILE=.env.starforged docker compose -p starforged --env-file .env.starforged -f docker-compose.yml down -v

  live:
    # Runs every src/**/*.live.test.ts against one real stack copy.
    # tests/live.sh fails the run when any behavior test is skipped, so a
    # misconfigured job can never pass silently.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Generate the copy env file
        working-directory: supabase
        run: python3 bin/gen-env.py --copy ironsworn --port 8000 --out .env.live

      - name: Mask generated keys in logs
        working-directory: supabase
        run: |
          echo "::add-mask::$(grep -E '^ANON_KEY=' .env.live | cut -d= -f2-)"
          echo "::add-mask::$(grep -E '^SERVICE_ROLE_KEY=' .env.live | cut -d= -f2-)"
          echo "::add-mask::$(grep -E '^POSTGRES_PASSWORD=' .env.live | cut -d= -f2-)"
          # The private signing JWK and Storage's static secret live in
          # service-only env files beside the main one (ticket #152).
          echo "::add-mask::$(grep -E '^GOTRUE_JWT_KEYS=' .env.live.gotrue | cut -d= -f2-)"
          echo "::add-mask::$(grep -E '^GOTRUE_JWT_SECRET=' .env.live.gotrue | cut -d= -f2-)"
          echo "::add-mask::$(grep -E '^AUTH_JWT_SECRET=' .env.live.storage | cut -d= -f2-)"

      - name: Validate the template renders
        working-directory: supabase
        run: ENV_FILE=.env.live docker compose -p live --env-file .env.live -f docker-compose.yml config --quiet

      - name: Start one stack copy
        working-directory: supabase
        run: ENV_FILE=.env.live docker compose -p live --env-file .env.live -f docker-compose.yml up -d

      - name: Wait until the copy is healthy and migrations applied
        working-directory: supabase
        run: |
          get_var() { grep -E "^$2=" "$1" | cut -d= -f2- || true; }
          PORT="$(get_var .env.live API_GW_HTTP_PORT)"
          ANON="$(get_var .env.live ANON_KEY)"
          SERVICE_KEY="$(get_var .env.live SERVICE_ROLE_KEY)"
          GW="http://localhost:$PORT"

          compose() {
            ENV_FILE=.env.live \
              docker compose -p live --env-file .env.live -f docker-compose.yml "$@"
          }

          wait_for() {
            local label="$1"
            shift
            local deadline=$((SECONDS + 300))
            until curl -sf "$@" >/dev/null 2>&1; do
              [ "$SECONDS" -ge "$deadline" ] && { echo "live: timed out waiting for $label" >&2; exit 1; }
              sleep 5
            done
            echo "live: $label up"
          }

          poll_for() {
            local label="$1"
            shift
            local deadline=$((SECONDS + 300))
            until "$@" >/dev/null 2>&1; do
              [ "$SECONDS" -ge "$deadline" ] && { echo "live: timed out waiting for $label" >&2; exit 1; }
              sleep 5
            done
            echo "live: $label ok"
          }

          realtime_healthy() {
            # Liveness via the unauthenticated /healthcheck route
            # (realtime/healthcheck.sh): the /api health endpoint
            # authenticates with an HS256 admin secret this stack
            # deliberately does not configure, so it accepts no probe
            # (ticket #152).
            compose exec -T realtime /bin/sh /realtime/healthcheck.sh
          }

          realtime_tenant_ready() {
            # The seed logs this only after the tenant row, its migrations
            # and the janitor pass are done: a drifted seed fork fails here
            # (ticket #152).
            compose logs realtime 2>/dev/null | grep -q "Tenant set-up successfully"
          }

          realtime_tenant_has_no_hs256_secret() {
            # The seed fork must leave the tenant's jwt_secret NULL; a
            # drifted mount would re-seed upstream's well-known constant.
            local db
            db="$(get_var .env.live POSTGRES_DB)"
            db="${db:-postgres}"
            [ "$(compose exec -T db psql -U postgres -d "$db" -t -A -c \
              "SELECT COALESCE(jwt_secret IS NULL, false) FROM _realtime.tenants WHERE external_id = 'realtime-dev'")" = "t" ]
          }

          realtime_metrics_refuse_hs256() {
            # The release-config fork leaves the metrics verifier no secret,
            # so /metrics refuses every caller (ticket #152).
            local token
            token="$(printf '{"alg":"HS256","typ":"JWT"}' | openssl base64 -A | tr '+/' '-_' | tr -d '=').$(printf '{"role":"anon","iat":%s,"exp":%s}' "$(date +%s)" "$(( $(date +%s) + 60 ))" | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
            token="${token}.$(printf '%s' "$token" | openssl dgst -sha256 -hmac 'super-secret-jwt-token-with-at-least-32-characters-long' -binary | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
            [ "$(compose exec -T realtime curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $token" http://localhost:4000/metrics)" = "403" ]
          }

          functions_placeholder_ok() {
            curl -s -H "apikey: $ANON" "$GW/functions/v1/smoke-probe" | grep -q FUNCTIONS_NOT_CONFIGURED
          }

          migrate_done() {
            compose logs migrate 2>/dev/null | grep -q "migrate: done"
          }

          wait_for "auth" -H "apikey: $ANON" "$GW/auth/v1/health"
          # The gateway's OpenAPI route only admits the service key; table reads
          # below go through the anon key like a real client.
          wait_for "rest" -H "apikey: $SERVICE_KEY" "$GW/rest/v1/"
          wait_for "storage" "$GW/storage/v1/status"
          poll_for "realtime" realtime_healthy
          poll_for "realtime tenant" realtime_tenant_ready
          poll_for "realtime tenant secret" realtime_tenant_has_no_hs256_secret
          poll_for "realtime metrics refuse HS256" realtime_metrics_refuse_hs256
          poll_for "functions" functions_placeholder_ok
          poll_for "migrations" migrate_done

      - name: Run the stack tests (zero skips allowed)
        working-directory: supabase
        run: ENV_FILE=.env.live tests/live.sh

      - name: Dump service logs on failure
        if: failure()
        working-directory: supabase
        run: ENV_FILE=.env.live docker compose -p live --env-file .env.live -f docker-compose.yml logs --tail 200

      - name: Bring the copy down
        if: always()
        working-directory: supabase
        run: ENV_FILE=.env.live docker compose -p live --env-file .env.live -f docker-compose.yml down -v

  e2e:
    # Runs the Playwright browser tests (e2e/*.spec.ts) against one real
    # stack copy plus the site container it serves. tests/e2e.sh fails the
    # run when any browser test is skipped, so a misconfigured job can never
    # pass silently. Traces and screenshots stay here as CI artifacts; they
    # are never posted to issues or pull requests (public repo).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Type-check the browser tests
        run: npx tsc --noEmit -p tsconfig.e2e.json

      - name: Generate the copy env file
        working-directory: supabase
        run: python3 bin/gen-env.py --copy ironsworn --port 8000 --out .env.live

      - name: Mask generated keys in logs
        working-directory: supabase
        run: |
          echo "::add-mask::$(grep -E '^ANON_KEY=' .env.live | cut -d= -f2-)"
          echo "::add-mask::$(grep -E '^SERVICE_ROLE_KEY=' .env.live | cut -d= -f2-)"
          echo "::add-mask::$(grep -E '^POSTGRES_PASSWORD=' .env.live | cut -d= -f2-)"
          # The private signing JWK and Storage's static secret live in
          # service-only env files beside the main one (ticket #152).
          echo "::add-mask::$(grep -E '^GOTRUE_JWT_KEYS=' .env.live.gotrue | cut -d= -f2-)"
          echo "::add-mask::$(grep -E '^GOTRUE_JWT_SECRET=' .env.live.gotrue | cut -d= -f2-)"
          echo "::add-mask::$(grep -E '^AUTH_JWT_SECRET=' .env.live.storage | cut -d= -f2-)"

      - name: Validate the template renders
        working-directory: supabase
        run: ENV_FILE=.env.live docker compose -p live --env-file .env.live -f docker-compose.yml config --quiet

      - name: Build the site image
        working-directory: supabase
        run: ENV_FILE=.env.live docker compose -p live --env-file .env.live -f docker-compose.yml build site

      - name: Start one stack copy
        working-directory: supabase
        run: ENV_FILE=.env.live docker compose -p live --env-file .env.live -f docker-compose.yml up -d

      - name: Wait until the copy is healthy and migrations applied
        working-directory: supabase
        run: |
          get_var() { grep -E "^$2=" "$1" | cut -d= -f2- || true; }
          PORT="$(get_var .env.live API_GW_HTTP_PORT)"
          ANON="$(get_var .env.live ANON_KEY)"
          SERVICE_KEY="$(get_var .env.live SERVICE_ROLE_KEY)"
          SITE_PORT="$(get_var .env.live SITE_HTTP_PORT)"
          GW="http://localhost:$PORT"

          compose() {
            ENV_FILE=.env.live \
              docker compose -p live --env-file .env.live -f docker-compose.yml "$@"
          }

          wait_for() {
            local label="$1"
            shift
            local deadline=$((SECONDS + 300))
            until curl -sf "$@" >/dev/null 2>&1; do
              [ "$SECONDS" -ge "$deadline" ] && { echo "e2e: timed out waiting for $label" >&2; exit 1; }
              sleep 5
            done
            echo "e2e: $label up"
          }

          poll_for() {
            local label="$1"
            shift
            local deadline=$((SECONDS + 300))
            until "$@" >/dev/null 2>&1; do
              [ "$SECONDS" -ge "$deadline" ] && { echo "e2e: timed out waiting for $label" >&2; exit 1; }
              sleep 5
            done
            echo "e2e: $label ok"
          }

          realtime_healthy() {
            # Liveness via the unauthenticated /healthcheck route
            # (realtime/healthcheck.sh): the /api health endpoint
            # authenticates with an HS256 admin secret this stack
            # deliberately does not configure, so it accepts no probe
            # (ticket #152).
            compose exec -T realtime /bin/sh /realtime/healthcheck.sh
          }

          realtime_tenant_ready() {
            # The seed logs this only after the tenant row, its migrations
            # and the janitor pass are done: a drifted seed fork fails here
            # (ticket #152).
            compose logs realtime 2>/dev/null | grep -q "Tenant set-up successfully"
          }

          realtime_tenant_has_no_hs256_secret() {
            # The seed fork must leave the tenant's jwt_secret NULL; a
            # drifted mount would re-seed upstream's well-known constant.
            local db
            db="$(get_var .env.live POSTGRES_DB)"
            db="${db:-postgres}"
            [ "$(compose exec -T db psql -U postgres -d "$db" -t -A -c \
              "SELECT COALESCE(jwt_secret IS NULL, false) FROM _realtime.tenants WHERE external_id = 'realtime-dev'")" = "t" ]
          }

          realtime_metrics_refuse_hs256() {
            # The release-config fork leaves the metrics verifier no secret,
            # so /metrics refuses every caller (ticket #152).
            local token
            token="$(printf '{"alg":"HS256","typ":"JWT"}' | openssl base64 -A | tr '+/' '-_' | tr -d '=').$(printf '{"role":"anon","iat":%s,"exp":%s}' "$(date +%s)" "$(( $(date +%s) + 60 ))" | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
            token="${token}.$(printf '%s' "$token" | openssl dgst -sha256 -hmac 'super-secret-jwt-token-with-at-least-32-characters-long' -binary | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
            [ "$(compose exec -T realtime curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $token" http://localhost:4000/metrics)" = "403" ]
          }

          functions_placeholder_ok() {
            curl -s -H "apikey: $ANON" "$GW/functions/v1/smoke-probe" | grep -q FUNCTIONS_NOT_CONFIGURED
          }

          migrate_done() {
            compose logs migrate 2>/dev/null | grep -q "migrate: done"
          }

          wait_for "auth" -H "apikey: $ANON" "$GW/auth/v1/health"
          # The gateway's OpenAPI route only admits the service key; table reads
          # below go through the anon key like a real client.
          wait_for "rest" -H "apikey: $SERVICE_KEY" "$GW/rest/v1/"
          wait_for "storage" "$GW/storage/v1/status"
          poll_for "realtime" realtime_healthy
          poll_for "realtime tenant" realtime_tenant_ready
          poll_for "realtime tenant secret" realtime_tenant_has_no_hs256_secret
          poll_for "realtime metrics refuse HS256" realtime_metrics_refuse_hs256
          poll_for "functions" functions_placeholder_ok
          poll_for "migrations" migrate_done
          wait_for "site" "http://localhost:$SITE_PORT/"

      - name: Run the browser tests (zero skips allowed)
        working-directory: supabase
        run: ENV_FILE=.env.live tests/e2e.sh

      - name: Upload traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 14

      - name: Dump service logs on failure
        if: failure()
        working-directory: supabase
        run: ENV_FILE=.env.live docker compose -p live --env-file .env.live -f docker-compose.yml logs --tail 200

      - name: Bring the copy down
        if: always()
        working-directory: supabase
        run: ENV_FILE=.env.live docker compose -p live --env-file .env.live -f docker-compose.yml down -v
